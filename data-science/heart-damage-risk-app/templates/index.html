<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSV Predictor</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <h1>Загрузите CSV-файл для анализа</h1>

    <form id="uploadForm" enctype="multipart/form-data">
        <label for="fileInput">Выберите CSV-файл:</label><br>
        <input type="file" id="fileInput" accept=".csv" required><br><br>

        <label for="show_full">Показать все предсказания?</label>
        <input type="checkbox" id="show_full"><br><br>

        <label for="show_percent">Показать проценты?</label>
        <input type="checkbox" id="show_percent"><br><br>

        <input type="submit" value="Отправить файл"/>
    </form>

    <p id="errorMessage"></p> <!-- Элемент для отображения ошибок -->

    <!-- Блок для отображения результата -->
    <div class="table-container">
        <table id="jsonTable" style="display:none;">
            <thead>
                <tr>
                    <th>ID пациента</th>
                    <th>Риск поражения сердца</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
